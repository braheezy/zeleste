<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeleste Collision Annotator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17191c;
      --panel: #22262b;
      --text: #eef1f4;
      --muted: #aeb6c0;
      --line: #3a414a;
      --accent: #72d6ff;
      --solid: rgba(255, 72, 72, 0.52);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
    }

    main {
      overflow: auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111317;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: #2b333b;
      margin-top: 8px;
    }

    button:hover { border-color: var(--accent); }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stats, .hint, #status {
      margin-top: 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .stats {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .stage {
      position: relative;
      width: max-content;
      image-rendering: pixelated;
      user-select: none;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Zeleste Collision</h1>

      <label for="backgroundSelect">Background</label>
      <select id="backgroundSelect"></select>

      <div class="row">
        <div>
          <label for="tileSize">Tile</label>
          <input id="tileSize" type="number" min="1" value="8">
        </div>
        <div>
          <label for="zoom">Zoom</label>
          <input id="zoom" type="number" min="1" max="8" value="3">
        </div>
      </div>

      <button id="saveButton" type="button">Save</button>
      <button id="clearButton" type="button">Clear</button>
      <button id="reloadButton" type="button">Reload</button>

      <div id="status">Loading backgrounds...</div>

      <div class="stats">
        <div>Image: <span id="imageStats">none</span></div>
        <div>Grid: <span id="gridStats">none</span></div>
        <div>Solid: <span id="markedStats">0</span></div>
        <div>JSON: <span id="annotationStats">none</span></div>
      </div>

      <div class="hint">
        Click or drag to mark solid collision. Right click or hold Option/Alt to erase.
        Shift-click fills a horizontal run to the right edge. Save writes beside the selected background.
      </div>
    </aside>

    <main>
      <div class="stage" id="stage">
        <canvas id="base"></canvas>
        <canvas id="overlay"></canvas>
      </div>
    </main>
  </div>

  <script>
    const backgroundSelect = document.getElementById('backgroundSelect');
    const tileSizeInput = document.getElementById('tileSize');
    const zoomInput = document.getElementById('zoom');
    const saveButton = document.getElementById('saveButton');
    const clearButton = document.getElementById('clearButton');
    const reloadButton = document.getElementById('reloadButton');
    const status = document.getElementById('status');
    const imageStats = document.getElementById('imageStats');
    const gridStats = document.getElementById('gridStats');
    const markedStats = document.getElementById('markedStats');
    const annotationStats = document.getElementById('annotationStats');
    const stage = document.getElementById('stage');
    const base = document.getElementById('base');
    const overlay = document.getElementById('overlay');
    const baseCtx = base.getContext('2d', { alpha: false });
    const overlayCtx = overlay.getContext('2d');

    let backgrounds = [];
    let currentBackground = null;
    let image = null;
    let gridW = 0;
    let gridH = 0;
    let tiles = new Set();
    let isPointerDown = false;
    let eraseMode = false;
    let lastKey = '';

    function key(x, y) {
      return `${x},${y}`;
    }

    function splitKey(value) {
      const [x, y] = value.split(',').map(Number);
      return { x, y };
    }

    function currentTileSize() {
      return Math.max(1, Number(tileSizeInput.value) || 8);
    }

    function currentZoom() {
      return Math.max(1, Number(zoomInput.value) || 1);
    }

    function setStatus(message) {
      status.textContent = message;
    }

    async function apiJson(url, options) {
      const response = await fetch(url, options);
      const result = await response.json();
      if (!response.ok || result.ok === false) {
        throw new Error(result.error || response.statusText);
      }
      return result;
    }

    async function loadBackgroundList() {
      const result = await apiJson('/api/backgrounds');
      backgrounds = result.backgrounds;
      backgroundSelect.replaceChildren();
      for (const background of backgrounds) {
        const option = document.createElement('option');
        option.value = background.image;
        option.textContent = `${background.image}${background.hasAnnotation ? '' : ' *'}`;
        backgroundSelect.append(option);
      }
      if (!backgrounds.length) {
        setStatus('No PNG backgrounds found in assets/backgrounds.');
        return;
      }
      await loadSelectedBackground();
    }

    async function loadSelectedBackground() {
      currentBackground = backgrounds.find((item) => item.image === backgroundSelect.value) || backgrounds[0];
      if (!currentBackground) return;
      await Promise.all([loadImage(currentBackground.image), loadAnnotation(currentBackground.image)]);
      redraw();
      setStatus(`Loaded ${currentBackground.image}`);
    }

    async function loadImage(path) {
      image = await new Promise((resolve, reject) => {
        const next = new Image();
        next.onload = () => resolve(next);
        next.onerror = reject;
        next.src = `/${path}?t=${Date.now()}`;
      });
    }

    async function loadAnnotation(imagePath) {
      tiles = new Set();
      const result = await apiJson(`/api/annotation?image=${encodeURIComponent(imagePath)}`);
      annotationStats.textContent = result.path;
      if (result.data && result.data.tileSize) {
        tileSizeInput.value = result.data.tileSize;
      }
      for (const tile of (result.data && result.data.tiles) || []) {
        if ((tile.kind || 'solid') === 'solid') {
          tiles.add(key(tile.x, tile.y));
        }
      }
    }

    function resizeCanvases() {
      const tileSize = currentTileSize();
      gridW = Math.ceil(image.width / tileSize);
      gridH = Math.ceil(image.height / tileSize);
      base.width = overlay.width = image.width;
      base.height = overlay.height = image.height;
      const zoom = currentZoom();
      stage.style.width = `${image.width * zoom}px`;
      stage.style.height = `${image.height * zoom}px`;
      base.style.width = overlay.style.width = `${image.width * zoom}px`;
      base.style.height = overlay.style.height = `${image.height * zoom}px`;
    }

    function redraw() {
      if (!image) return;
      const tileSize = currentTileSize();
      resizeCanvases();
      baseCtx.imageSmoothingEnabled = false;
      overlayCtx.imageSmoothingEnabled = false;
      baseCtx.clearRect(0, 0, base.width, base.height);
      baseCtx.drawImage(image, 0, 0);
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      overlayCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--solid');
      for (const tileKey of tiles) {
        const tile = splitKey(tileKey);
        overlayCtx.fillRect(tile.x * tileSize, tile.y * tileSize, tileSize, tileSize);
      }

      overlayCtx.strokeStyle = 'rgba(255,255,255,0.48)';
      overlayCtx.lineWidth = 1;
      overlayCtx.beginPath();
      for (let x = 0; x <= image.width; x += tileSize) {
        overlayCtx.moveTo(x + 0.5, 0);
        overlayCtx.lineTo(x + 0.5, image.height);
      }
      for (let y = 0; y <= image.height; y += tileSize) {
        overlayCtx.moveTo(0, y + 0.5);
        overlayCtx.lineTo(image.width, y + 0.5);
      }
      overlayCtx.stroke();

      imageStats.textContent = `${image.width}x${image.height}`;
      gridStats.textContent = `${gridW}x${gridH}`;
      markedStats.textContent = String(tiles.size);
    }

    function setTile(x, y, erase) {
      if (x < 0 || y < 0 || x >= gridW || y >= gridH) return;
      const tileKey = key(x, y);
      if (erase) {
        tiles.delete(tileKey);
      } else {
        tiles.add(tileKey);
      }
    }

    function eventToTile(event) {
      const rect = overlay.getBoundingClientRect();
      const scaleX = overlay.width / rect.width;
      const scaleY = overlay.height / rect.height;
      const tileSize = currentTileSize();
      return {
        x: Math.floor(((event.clientX - rect.left) * scaleX) / tileSize),
        y: Math.floor(((event.clientY - rect.top) * scaleY) / tileSize)
      };
    }

    function paintEvent(event) {
      if (!image) return;
      const tile = eventToTile(event);
      const tileKey = key(tile.x, tile.y);
      if (tileKey === lastKey && !event.shiftKey) return;
      lastKey = tileKey;
      if (event.shiftKey && !eraseMode) {
        for (let x = tile.x; x < gridW; x += 1) setTile(x, tile.y, false);
      } else {
        setTile(tile.x, tile.y, eraseMode);
      }
      redraw();
    }

    function annotationObject() {
      const sorted = [...tiles].map(splitKey).sort((a, b) => (a.y - b.y) || (a.x - b.x));
      return {
        image: currentBackground.image.split('/').pop(),
        tileSize: currentTileSize(),
        width: image.width,
        height: image.height,
        tiles: sorted.map((tile) => ({
          x: tile.x,
          y: tile.y,
          kind: 'solid',
          material: 'solid'
        }))
      };
    }

    async function save() {
      if (!currentBackground || !image) return;
      const result = await apiJson('/api/save-annotation', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ image: currentBackground.image, data: annotationObject() })
      });
      currentBackground.hasAnnotation = true;
      currentBackground.annotation = result.path;
      annotationStats.textContent = result.path;
      setStatus(`Saved ${result.path}; generated ${result.bundle}/collision.bin`);
    }

    backgroundSelect.addEventListener('change', () => {
      loadSelectedBackground().catch((error) => setStatus(`Load failed: ${error}`));
    });

    saveButton.addEventListener('click', () => {
      save().catch((error) => setStatus(`Save failed: ${error}`));
    });

    clearButton.addEventListener('click', () => {
      if (!confirm('Clear all solid tiles for this background?')) return;
      tiles.clear();
      redraw();
    });

    reloadButton.addEventListener('click', () => {
      loadSelectedBackground().catch((error) => setStatus(`Reload failed: ${error}`));
    });

    tileSizeInput.addEventListener('change', redraw);
    zoomInput.addEventListener('change', redraw);

    overlay.addEventListener('contextmenu', (event) => event.preventDefault());
    overlay.addEventListener('pointerdown', (event) => {
      isPointerDown = true;
      eraseMode = event.button === 2 || event.altKey;
      lastKey = '';
      overlay.setPointerCapture(event.pointerId);
      paintEvent(event);
    });
    overlay.addEventListener('pointermove', (event) => {
      if (isPointerDown) paintEvent(event);
    });
    overlay.addEventListener('pointerup', () => {
      isPointerDown = false;
      eraseMode = false;
      lastKey = '';
    });
    overlay.addEventListener('pointercancel', () => {
      isPointerDown = false;
      eraseMode = false;
      lastKey = '';
    });

    loadBackgroundList().catch((error) => setStatus(`Startup failed: ${error}`));
  </script>
</body>
</html>
