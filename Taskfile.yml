version: "3"

tasks:
  collision:
    desc: Open the level collision editor
    cmds:
      - python3 tools/collision_server.py

  scene:
    desc: Open the scene animation editor
    cmds:
      - python3 tools/scene_server.py

  granny-cutscene:
    desc: Open the room 2 Granny cutscene editor
    cmds:
      - python3 tools/granny_cutscene_server.py

  city-6zb-cutscene:
    desc: Open the chapter 1 room 6zb NPC cutscene editor
    cmds:
      - python3 tools/city_6zb_cutscene_server.py

  hair:
    desc: Open the player hair anchor editor
    cmds:
      - python3 tools/hair_anchor_server.py

  city-layout:
    desc: Open the chapter 1 room layout picker
    cmds:
      - python3 tools/city_layout_server.py
